<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Supabase News Platform</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <h1>🔐 Login</h1>

  <nav>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="register.html">Register</a>
  </nav>

  <form id="login-form">
    <input type="email" id="email" placeholder="Email" required />
    <input type="password" id="password" placeholder="Password" required />
    <button type="submit">Login</button>
  </form>

  <p id="message"></p>

  <footer>
    <p>© 2025 Supabase News Platform | Developed by Snežana Kragujevac</p>
  </footer>

  <script type="module">
    import { supabase } from './js/supabaseClient.js'

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault()

      const email = document.getElementById('email').value
      const password = document.getElementById('password').value
      const { error } = await supabase.auth.signInWithPassword({ email, password })

      const msg = document.getElementById('message')
      msg.textContent = error ? error.message : '✅ Login successful!'
      if (!error) setTimeout(() => (window.location.href = 'index.html'), 1000)
    })
  </script>
</body>
</html>
