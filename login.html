<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Supabase News Platform</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="icon" type="image/png" href="assets/icon-lock.png" />
</head>
<body>
  <h1><img src="assets/icon-lock.png" width="28" /> Login</h1>

  <nav>

    <a href="index.html">Home</a>
    <a href="about.html">About</a>
  </nav>
<div id="feedback" class="message-banner"></div>

  <main class="content">
    <form id="login-form" class="form-container">
      <label>Email</label>
      <input type="email" id="email" placeholder="Enter email" required />

      <label>Password</label>
      <input type="password" id="password" placeholder="Enter password" required />

      <button type="submit">Login</button>
      <p id="message"></p>
    </form>
  </main>

  <footer>
    <p>© 2025 Supabase News Platform | Developed by Snežana Kragujevac</p>
  </footer>

   <script type="module">
    import { supabase } from './js/supabaseClient.js'

    //Feedback Message Function
    function showFeedback(message, type = 'success') {
      const banner = document.getElementById('feedback')
      banner.textContent = message
      banner.className = `message-banner ${type}`
      banner.style.display = 'block'
      setTimeout(() => (banner.style.display = 'none'), 4000)
    }

    // Handle login form submit
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault()

      const email = document.getElementById('email').value.trim()
      const password = document.getElementById('password').value.trim()

      if (!email || !password) {
        showFeedback('❌ Please fill in both fields.', 'error')
        return
      }

      const { data, error } = await supabase.auth.signInWithPassword({
        email,
        password,
      })

      if (error) {
        showFeedback('❌ Login failed: ' + error.message, 'error')
      } else {
        showFeedback('✅ Login successful! Redirecting...', 'success')
        setTimeout(() => {
          window.location.href = 'index.html'
        }, 2000)
      }
    })
  </script>
</body>
</html>
