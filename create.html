<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Article | Supabase News Platform</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="icon" type="image/png" href="assets/icon-article.png" />
</head>
<body>
  <h1><img src="assets/icon-article.png" width="28" /> Create New Article</h1>

  <nav>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <button id="logout">Logout</button>
  </nav>

  <main class="content">
    <form id="article-form" class="form-container">
      <label>Title</label>
      <input type="text" id="title" placeholder="Enter article title" required />

      <label>Body</label>
      <textarea id="body" placeholder="Write your article here..." required></textarea>

      <label>Category</label>
      <input type="text" id="category" placeholder="Enter category" required />

      <button type="submit">Submit Article</button>
      <p id="message"></p>
    </form>
  </main>

  <footer>
    <p>© 2025 Supabase News Platform | Developed by Snežana Kragujevac</p>
  </footer>

  <script type="module">
    import { supabase } from './js/supabaseClient.js'

    async function checkUser() {
      const {
        data: { user },
      } = await supabase.auth.getUser()

      if (!user) {
        alert('⚠️ You must be logged in to create an article.')
        window.location.href = 'login.html'
      }
      return user
    }

    document.getElementById('article-form').addEventListener('submit', async (e) => {
      e.preventDefault()
      const user = await checkUser()

      const title = document.getElementById('title').value.trim()
      const body = document.getElementById('body').value.trim()
      const category = document.getElementById('category').value.trim()

      const { error } = await supabase.from('articles').insert([
        {
          title,
          body,
          category,
          submitted_by: user.id,
        },
      ])

      const msg = document.getElementById('message')
      if (error) {
        msg.textContent = `❌ ${error.message}`
      } else {
        msg.textContent = '✅ Article submitted successfully!'
        document.getElementById('article-form').reset()
      }
    })

    document.getElementById('logout').addEventListener('click', async () => {
      await supabase.auth.signOut()
      window.location.href = 'index.html'
    })

    checkUser()
  </script>
</body>
</html>
