<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>📰 Supabase News Platform</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="icon" type="image/png" href="assets/icon-news.png" />
</head>
<body>
  <h1><img src="assets/icon-news-round.png" width="32" /> Latest Articles</h1>

  <nav>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="login.html" id="login-link">Login</a>
    <a href="register.html" id="register-link">Register</a>
    <a href="create.html" id="create-link" style="display:none;">Create Article</a>
    <button id="logout" style="display:none;">Logout</button>
  </nav>

  <button id="dark-mode-toggle" class="dark-mode-btn">
    <img src="assets/icon-darkmode.png" width="20" /> Toggle Dark Mode
  </button>

  <div id="articles"></div>

  <footer>
    <p>© 2025 Supabase News Platform | Developed by Snežana Kragujevac</p>
  </footer>

  <script type="module">
    import { supabase } from './js/supabaseClient.js'

    const container = document.getElementById('articles')
    container.innerHTML = '<p>Loading articles...</p>'

    async function loadArticles() {
      const { data, error } = await supabase
        .from('articles')
        .select('*')
        .order('created_at', { ascending: false })

      if (error) {
        container.innerHTML = `<p>Error loading articles: ${error.message}</p>`
        return
      }

      if (!data.length) {
        container.innerHTML = '<p>No articles found.</p>'
        return
      }

      container.innerHTML = data
        .map(
          (a) => `
          <div class="article">
            <h3><img src="assets/icon-article.png" width="20" /> ${a.title}</h3>
            <p>${a.body}</p>
            <small>${a.category} | ${new Date(a.created_at).toLocaleString()}</small>
          </div>
        `
        )
        .join('')
    }

    async function checkUser() {
      const {
        data: { session },
      } = await supabase.auth.getSession()

      if (session) {
        document.getElementById('login-link').style.display = 'none'
        document.getElementById('register-link').style.display = 'none'
        document.getElementById('create-link').style.display = 'inline'
        document.getElementById('logout').style.display = 'inline'
      }
    }

    document.getElementById('logout').addEventListener('click', async () => {
      await supabase.auth.signOut()
      location.reload()
    })

    const toggle = document.getElementById('dark-mode-toggle')
    toggle.addEventListener('click', () => {
      document.body.classList.toggle('dark-mode')
    })

    loadArticles()
    checkUser()
  </script>
</body>
</html>
