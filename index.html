<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>📰 Supabase News Platform</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="icon" type="image/png" href="assets/icon-news.png" />
</head>
<body>
  <h1><img src="assets/icon-news-round.png" width="32" alt="News" /> Latest Articles</h1>

  <!-- ===== Navigation ===== -->
  <nav>
    <div id="user-info" class="user-banner" style="display:none;"></div>

    <a href="my-articles.html" id="my-articles-link" style="display:none;">My Articles</a>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="login.html" id="login-link">Login</a>
    <a href="register.html" id="register-link">Register</a>
    <a href="create.html" id="create-link" style="display:none;">Create Article</a>
    <button id="logout" style="display:none;">Logout</button>
  </nav>

  <!-- ===== Filter Section ===== -->
  <div id="filter-container" class="filter-bar">
    <label for="category-filter">Filter by Category:</label>
    <select id="category-filter">
      <option value="">All</option>
    </select>
  </div>

  <!-- ===== Dark Mode Toggle ===== -->
  <button id="dark-mode-toggle" class="dark-mode-btn">
    <img src="assets/icon-darkmode.png" width="20" alt="Dark Mode" /> Toggle Dark Mode
  </button>

  <!-- ===== Article Container ===== -->
  <div id="articles"></div>

  <footer>
    <p>© 2025 Supabase News Platform | Developed by Snežana Kragujevac</p>
  </footer>

  <!-- ===== Script Section ===== -->
  <script type="module">
    import { supabase } from './js/supabaseClient.js'

    const container = document.getElementById('articles')
    const filterDropdown = document.getElementById('category-filter')

    // Load Unique Categories
    async function loadCategories() {
      const { data, error } = await supabase.from('articles').select('category')
      if (error) return console.error('Error loading categories:', error.message)
      const categories = [...new Set(data.map((a) => a.category))] // unique values
      categories.forEach((cat) => {
        const opt = document.createElement('option')
        opt.value = cat
        opt.textContent = cat
        filterDropdown.appendChild(opt)
      })
    }

    // Load Articles (optionally filtered)
    async function loadArticles(category = '') {
      container.innerHTML = '<p>Loading articles...</p>'
      let query = supabase.from('articles').select('*').order('created_at', { ascending: false })
      if (category) query = query.eq('category', category)

      const { data, error } = await query

      if (error) {
        container.innerHTML = `<p>Error: ${error.message}</p>`
        return
      }

      if (!data.length) {
        container.innerHTML = '<p>No articles found.</p>'
        return
      }

      container.innerHTML = data
        .map(
          (a) => `
          <div class="article">
            <h3><img src="assets/icon-article.png" width="20" alt="Article" /> ${a.title}</h3>
            <p>${a.body}</p>
            <small>${a.category} | ${new Date(a.created_at).toLocaleString()}</small>
          </div>`
        )
        .join('')
    }

    // Filter Change Event
    filterDropdown.addEventListener('change', (e) => {
      loadArticles(e.target.value)
    })

    // Check if User Logged In
   async function checkUser() {
  const {
    data: { session },
  } = await supabase.auth.getSession()

  const userBanner = document.getElementById('user-info')

  if (session && session.user) {
    document.getElementById('login-link').style.display = 'none'
    document.getElementById('register-link').style.display = 'none'
    document.getElementById('create-link').style.display = 'inline'
    document.getElementById('my-articles-link').style.display = 'inline'
    document.getElementById('logout').style.display = 'inline'

    userBanner.style.display = 'block'
    userBanner.textContent = `👤 Logged in as: ${session.user.email}`
  } else {
    userBanner.style.display = 'none'
  }
}


    // Logout Functionality
    document.getElementById('logout').addEventListener('click', async () => {
      await supabase.auth.signOut()
      location.reload()
    })

    // Dark Mode Toggle
    const toggle = document.getElementById('dark-mode-toggle')
    toggle.addEventListener('click', () => {
      document.body.classList.toggle('dark-mode')
    })

    // Run App
    loadCategories()
    loadArticles()
    checkUser()
  </script>
</body>
</html>
