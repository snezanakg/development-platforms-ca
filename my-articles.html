<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>📝 My Articles</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header>
    <h1>📝 My Articles</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="create.html">Create</a>
      <button id="logout">Logout</button>
    </nav>
  </header>

  <main>
    <div id="articles-container"></div>
  </main>

  <footer>
    <p>© 2025 Supabase News Platform | Developed by Snežana Kragujevac</p>
  </footer>

  <script type="module">
    import { supabase } from './js/supabaseClient.js'

    const container = document.getElementById('articles-container')

    async function loadUserArticles() {
      const {
        data: { session },
      } = await supabase.auth.getSession()

      if (!session) {
        container.innerHTML = '<p>Please log in to view your articles.</p>'
        return
      }

      const userId = session.user.id

      const { data, error } = await supabase
        .from('articles')
        .select('*')
        .eq('submitted_by', userId)
        .order('created_at', { ascending: false })

      if (error) {
        container.innerHTML = `<p class="error">Error: ${error.message}</p>`
        return
      }

      if (data.length === 0) {
        container.innerHTML = '<p>You have not submitted any articles yet.</p>'
        return
      }

      container.innerHTML = data
        .map(
          (a) => `
            <article class="article-card">
              <h3>${a.title}</h3>
              <p>${a.body}</p>
              <small>${a.category} | ${new Date(a.created_at).toLocaleString()}</small>
            </article>
          `
        )
        .join('')
    }

    document.getElementById('logout').addEventListener('click', async () => {
      await supabase.auth.signOut()
      window.location.href = 'login.html'
    })

    loadUserArticles()
  </script>
</body>
</html>
