<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register | Supabase News Platform</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="icon" type="image/png" href="assets/icon-email.png" />
</head>
<body>
  <h1><img src="assets/icon-email.png" width="28" /> Register</h1>

  <nav>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
     <a href="login.html">Login</a>
  </nav>
  <div id="feedback" class="message-banner"></div>

  <main class="content">
    <form id="register-form" class="form-container">
        <label for="email">Email</label>
      <input type="email" id="email" placeholder="Enter your email" required />

      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Enter a password" required minlength="6" />

      <label for="confirm">Confirm Password</label>
      <input type="password" id="confirm" placeholder="Confirm your password" required minlength="6" />

      <button type="submit">Register</button>
    </form>
  </main>

  <footer>
    <p>© 2025 Supabase News Platform | Developed by Snežana Kragujevac</p>
  </footer>

  <script type="module">
    import { supabase } from './js/supabaseClient.js'

   //Feedback Message Function
    function showFeedback(message, type = 'success') {
      const banner = document.getElementById('feedback')
      banner.textContent = message
      banner.className = `message-banner ${type}`
      banner.style.display = 'block'
      setTimeout(() => (banner.style.display = 'none'), 4000)
    }

    // Handle registration form submit
    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault()

      const email = document.getElementById('email').value.trim()
      const password = document.getElementById('password').value.trim()
      const confirm = document.getElementById('confirm').value.trim()

      if (!email || !password || !confirm) {
        showFeedback('❌ Please fill in all fields.', 'error')
        return
      }

      if (password !== confirm) {
        showFeedback('❌ Passwords do not match.', 'error')
        return
      }

      const { data, error } = await supabase.auth.signUp({
        email,
        password,
      })

      if (error) {
        showFeedback('❌ Registration failed: ' + error.message, 'error')
      } else {
        showFeedback('✅ Registration successful! Check your email for confirmation.', 'success')
        setTimeout(() => {
          window.location.href = 'login.html'
        }, 3000)
      }
    })
  </script>
</body>
</html>
