<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register | Supabase News Platform</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="icon" type="image/png" href="assets/icon-email.png" />
</head>
<body>
  <h1><img src="assets/icon-email.png" width="28" /> Register</h1>

  <nav>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
  </nav>

  <main class="content">
    <form id="register-form" class="form-container">
      <label>Email</label>
      <input type="email" id="email" placeholder="Enter email" required />

      <label>Password</label>
      <input type="password" id="password" placeholder="Create password" required />

      <button type="submit">Register</button>
      <p id="message"></p>
    </form>
  </main>

  <footer>
    <p>© 2025 Supabase News Platform | Developed by Snežana Kragujevac</p>
  </footer>

  <script type="module">
    import { supabase } from './js/supabaseClient.js'

    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault()
      const email = document.getElementById('email').value
      const password = document.getElementById('password').value

      const { error } = await supabase.auth.signUp({ email, password })

      const msg = document.getElementById('message')
      if (error) {
        msg.textContent = '❌ ' + error.message
      } else {
        msg.textContent = '✅ Registration successful! Please confirm your email.'
      }
    })
  </script>
</body>
</html>
